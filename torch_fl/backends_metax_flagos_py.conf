# MetaX + flagos_python hybrid backend config.
# Use FlagGems Python (Triton) wherever kernels exist; metax C++ for SPLIT_K mm/bmm,
# mean non-inner-dim path, tensor factories, and embedding alloc.
# Greedy decode → cuda (DeviceBoxingGuard on MetaX cu-bridge).
#
#   export GEMS_VENDOR=metax FLAGGEMS_SOURCE_DIR=/path/to/flag_gems
#   unset FLAGOS_DISABLE_FLAGGEMS_PY
#   FLAGOS_BACKEND_CONFIG=torch_fl/backends_metax_flagos_py.conf pytest ...

# --- flagos_python (FlagGems Triton kernels) ---
abs = flagos_python
acos = flagos_python
add.Tensor = flagos_python
all = flagos_python
bitwise_and.Tensor = flagos_python
cat = flagos_python
constant_pad_nd = flagos_python
cos = flagos_python
index.Tensor = flagos_python
le.Tensor = flagos_python
mul.Tensor = flagos_python
mul.Scalar = flagos_python
neg = flagos_python
nll_loss_forward = flagos_python
nll_loss_backward = flagos_python
pow.Tensor_Scalar = flagos_python
rsqrt = flagos_python
silu = flagos_python
silu_backward = flagos_python
sin = flagos_python
_softmax = flagos_python
sum.dim_IntList = flagos_python
where.self = flagos_python

# --- metax: SPLIT_K mm/bmm, mean non-inner-dim, factories, embedding ---
mm = metax
mm.out = metax
bmm = metax
bmm.out = metax
mean.dim = metax

zeros = metax
new_ones = metax
ones_like = metax
scalar_tensor = metax
_local_scalar_dense = metax
_to_copy = metax
embedding = metax
embedding_dense_backward = metax
slice_backward = metax

div.Scalar = metax
sub = metax
relu = metax
sigmoid = metax
clone = metax

# --- Greedy sampling + framework ops ---
argmax = cuda
argmin = cuda
fill_.Scalar = cuda
arange = cuda
arange.start_step = cuda
sub.Tensor = cuda
eq.Tensor = cuda
eq.Scalar = cuda
max = cuda
bitwise_not = cuda
bitwise_or.Tensor = cuda
any = cuda
any.dim = cuda
lt.Tensor = cuda
lt.Scalar = cuda
cumsum = cuda
